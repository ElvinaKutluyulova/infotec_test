<div class="container">
  <h1 class="title">Барная карта</h1>
  
  <div class="actions">
    <button matButton="filled" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Добавить коктейль
    </button>
  </div>

  <div class="list">
    @for (cocktail of cocktails(); track cocktail.id) {
      <menu-card 
        [cocktail]="cocktail"
        (edit)="editCocktail($event)"
        (delete)="deleteCocktail($event)"
      />
    } @empty {
      <p class="empty">Нет коктейлей, добавьте первый</p>
    }
  </div>
</div>
